<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Local Chat Rooms</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; height: 100vh; margin: 0; }
        #server-list, #chat { padding: 20px; flex: 1; border-right: 1px solid #ccc; overflow-y: auto; }
        #chat { flex: 2; display: flex; flex-direction: column; }
        .server { cursor: pointer; padding: 10px; background: #f0f0f0; margin-bottom: 10px; border-radius: 5px; }
        .server:hover { background: #e0e0e0; }
        #messages { flex: 1; overflow-y: auto; border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
        #message-form { display: flex; }
        #message-form input { flex: 1; padding: 10px; }
        #message-form button { padding: 10px; }
        .message { margin-bottom: 10px; }
        .delete-btn { cursor: pointer; color: red; font-size: 14px; margin-left: 10px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
</head>
<body>
    <div id="server-list">
        <h2>Servers</h2>
        <div id="servers"></div>
        <input type="text" id="new-server-name" placeholder="New server name">
        <button onclick="createServer()">Create Server</button>
    </div>
    <div id="chat">
        <h2 id="chat-title">Select a server</h2>
        <div id="messages"></div>
        <form id="message-form" onsubmit="sendMessage(event)">
            <input type="text" id="message-input" placeholder="Type a message">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        const gun = Gun({
            peers: [
                'https://gun-manhattan.herokuapp.com/gun'
            ]
        });

        let currentRoom = null;
        let roomRef = null;
        let seenMessages = {};

        let localServers = JSON.parse(localStorage.getItem('chatServers')) || {};

        // Zufällige Benutzer-ID (für Demo-Zwecke)
        const userId = 'user_' + Math.floor(Math.random() * 1000); // Für Testzwecke

        function renderServers() {
            const serversDiv = document.getElementById('servers');
            serversDiv.innerHTML = '';
            for (const serverName in localServers) {
                const div = document.createElement('div');
                div.className = 'server';
                div.textContent = serverName;
                div.onclick = () => joinServer(serverName);
                serversDiv.appendChild(div);
            }
        }

        function createServer() {
            const name = document.getElementById('new-server-name').value.trim();
            if (!name || localServers[name]) return alert('Invalid or existing server name.');
            localServers[name] = true;
            saveServers();
            renderServers();
            document.getElementById('new-server-name').value = '';
        }

        function joinServer(name) {
            currentRoom = name;
            document.getElementById('chat-title').textContent = 'Chatting in: ' + name;
            document.getElementById('messages').innerHTML = '';

            if (roomRef) {
                roomRef.off();
            }

            seenMessages = {};

            roomRef = gun.get('rooms').get(name);

            roomRef.map().on((data, id) => {
                // Nur Nachrichten für den aktuellen Raum anzeigen
                if (currentRoom !== name) return;
                if (data && data.text && !seenMessages[id]) {
                    seenMessages[id] = true;
                    addMessage(data.text, id, data.userId); // User-ID zum Löschen prüfen
                }
            });
        }

        function addMessage(msg, id, userId) {
            const p = document.createElement('p');
            p.className = 'message';
            p.textContent = msg;

            // Löschbutton nur für eigene Nachrichten
            if (userId === userId) {
                const deleteBtn = document.createElement('span');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = () => deleteMessage(id);
                p.appendChild(deleteBtn);
            }

            const messagesDiv = document.getElementById('messages');
            messagesDiv.appendChild(p);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMessage(e) {
            e.preventDefault();
            if (!currentRoom) return alert('Select a server first.');
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;

            // Nachricht zusammen mit Benutzer-ID speichern
            roomRef.set({ text: message, timestamp: Gun.state(), userId: userId });
            input.value = '';
        }

        function deleteMessage(id) {
            // Nachricht aus Gun.js löschen
            roomRef.get(id).put(null); // Löschen der Nachricht
        }

        function saveServers() {
            localStorage.setItem('chatServers', JSON.stringify(localServers));
        }

        // Initialize
        renderServers();
    </script>
</body>
</html>
